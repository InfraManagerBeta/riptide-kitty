name: validate-kitty

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test (synthetic GLB fixtures)
        run: node --test scripts/test-validate-kitty.mjs

      # Green means the asset PASSES (spec-001). A missing asset is a
      # failure like any other: the validator prints a clear message and
      # exits non-zero — there is no warning-skip.
      - name: Validate the real asset
        run: node scripts/validate-kitty.mjs
